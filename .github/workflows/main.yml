name: Deploy to WordPress.org

on:
  push:
    tags:
      - 'v*'   # fx v1.0.1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Prepare SVN repo
        env:
          PLUGIN_SLUG: linkable
        run: |
          svn co "https://plugins.svn.wordpress.org/$PLUGIN_SLUG" svn-wporg
          # Ryd trunk og sync fra GitHub
          rm -rf svn-wporg/trunk/*
          rsync -rc --delete \
            --exclude='.git' \
            --exclude='.github' \
            ./ svn-wporg/trunk/

      - name: Create tag in SVN
        env:
          PLUGIN_SLUG: linkable
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"   # v1.0.1 -> 1.0.1
          cd svn-wporg

          # Hvis tag allerede findes, så fjern det først
          if [ -d "tags/$VERSION" ]; then
            svn rm "tags/$VERSION"
          fi

          # Opret tag som en ren kopi af trunk
          svn cp trunk "tags/$VERSION"

      - name: Commit and push to WordPress.org
        env:
          WPORG_USERNAME: ${{ secrets.WPORG_USERNAME }}
          WPORG_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
        run: |
          cd svn-wporg
          svn status
          svn add * --force
          svn status

          svn commit \
            --username "$WPORG_USERNAME" \
            --password "$WPORG_PASSWORD" \
            --non-interactive \
            --no-auth-cache \
            -m "Deploy version ${GITHUB_REF#refs/tags/v}"
